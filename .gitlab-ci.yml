stages:
  - mavenbuild
  - maventest

maven-build:
  stage: mavenbuild
  tags:
    - jakeb_tag
  script:
    - cd Backend/project/project2
    - mvn package
  only:
    refs:
      - 90-JAKEB_CICD
    changes:
      - Backend/**/*

maven-test:
  stage: maventest
  tags:
    - jakeb_tag
  script:
    - cd Backend/project/project2
    - mvn test
  only:
    refs:
      - 90-JAKEB_CICD
    changes:
      - Backend/**/*


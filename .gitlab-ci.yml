stages:
  - mavenbuild
  - maventest

maven-build:
  stage: mavenbuild
  tags:
    - coltens_tag      # <-- change to your runner's tag
  script:
    - cd Backend/project/project2        # change 'Backend' to to where you have the pom.xml (do not add / in the beginning)
    - mvn package
  only:
    refs:
      - colten_cicd
    changes:
      - Backend/**/*


maven-test:
  stage: maventest
  tags:
    - coltens_tag     # <-- change to your runner's tag
  script:
    - cd Backend/project/project2       # change 'Backend' to to where you have the pom.xml (do not add / in the beginning)
    - mvn test
  only:
    refs:
      - colten_cicd
    changes:
      - Backend/**/*
